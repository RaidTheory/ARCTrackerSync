[package]
name = "arctracker-sync"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "arctracker-sync"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
compact_str = "0.8"
crossbeam-channel = "0.5"
directories = "6"
eframe = "0.33"
etherparse = "0.15"
getrandom = "0.2"
hex = "0.4"
pcapsql-core = { path = "vendor/pcapsql-core", default-features = false }
rfd = "0.15"
rust-i18n = "3"
self-replace = "1.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "2", features = ["json", "tls"] }
# DEFLATE-only: GitHub-produced release zips use DEFLATE; skip bzip2/zstd/aes to stay lean.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.19"

[dev-dependencies]
# Used by tests/updater_e2e.rs to author release zips and checksums for the
# in-process server. (The integration test target gets no manifest — see lib.rs.)
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"

[build-dependencies]
# Bakes the app/tray icon (assets/arc-mark.png) into raw RGBA at build time, so
# the runtime needs no image-decoding dependency. Also encodes the multi-size
# .ico embedded as the executable's Win32 icon (Explorer/taskbar). PNG + ICO
# only to stay lean (ICO frames are PNG-compressed, so it reuses the png codec).
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"
# Compiles a generated .rc that embeds the baked .ico as the PE icon resource
# (embed-manifest only handles the manifest, never an icon).
embed-resource = "3"
